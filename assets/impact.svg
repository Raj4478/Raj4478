<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="title desc">
  <title id="title">Impact in production</title>
  <desc id="desc">65 percent faster claim processing, 90 percent fewer unhandled queue errors, 55 percent lower database response time, 99.8 percent uptime on AWS, more than 10 thousand concurrent WebSocket requests, and a 95-plus Lighthouse score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070812"/><stop offset="1" stop-color="#0c0e22"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151833"/><stop offset="1" stop-color="#0f1126"/></linearGradient>
    <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <radialGradient id="haze"><stop offset="0" stop-color="#4f46e5" stop-opacity=".25"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="1280" height="250" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .num { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; }
    .lbl { font-size: 13.5px; fill: #c7cbe6; }
    .sub { font-size: 11px; fill: #7c82b0; }
    .after { transform-box: fill-box; transform-origin: left center; animation: shrink 2.4s cubic-bezier(.2,.8,.2,1) .4s both; }
    @keyframes shrink { from { transform: scaleX(2.6); } to { transform: scaleX(1); } }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 2.2s cubic-bezier(.2,.8,.2,1) .4s both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .rise { transform-box: fill-box; transform-origin: center bottom; animation: rise 1.8s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1280" height="250" fill="url(#bg)"/>
    <ellipse cx="640" cy="125" rx="640" ry="180" fill="url(#haze)"/>

    <g class="sans">
      <!-- tile template: 188 x 186, starting x = 41 + i * 202 -->
      <g transform="translate(41 32)">
        <rect width="188" height="186" rx="16" fill="url(#tile)" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="18" y="56" class="num" fill="url(#g1)">−65%</text>
        <text x="18" y="84" class="lbl">claim processing time</text>
        <text x="18" y="102" class="sub mono">event-driven OCR pipeline</text>
        <rect x="18" y="140" width="152" height="8" rx="4" fill="#ffffff" fill-opacity=".07"/>
        <rect x="18" y="140" width="53" height="8" rx="4" fill="url(#g1)" class="after"/>
        <text x="18" y="168" class="sub mono">before ▸ after</text>
      </g>
      <g transform="translate(243 32)">
        <rect width="188" height="186" rx="16" fill="url(#tile)" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="18" y="56" class="num" fill="url(#g2)">−90%</text>
        <text x="18" y="84" class="lbl">unhandled queue errors</text>
        <text x="18" y="102" class="sub mono">SQS FIFO + DLQ + retries</text>
        <rect x="18" y="140" width="152" height="8" rx="4" fill="#ffffff" fill-opacity=".07"/>
        <rect x="18" y="140" width="15" height="8" rx="4" fill="url(#g2)" class="after"/>
        <text x="18" y="168" class="sub mono">before ▸ after</text>
      </g>
      <g transform="translate(445 32)">
        <rect width="188" height="186" rx="16" fill="url(#tile)" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="18" y="56" class="num" fill="url(#g3)">−55%</text>
        <text x="18" y="84" class="lbl">database response time</text>
        <text x="18" y="102" class="sub mono">TypeORM indexing</text>
        <rect x="18" y="140" width="152" height="8" rx="4" fill="#ffffff" fill-opacity=".07"/>
        <rect x="18" y="140" width="68" height="8" rx="4" fill="url(#g3)" class="after"/>
        <text x="18" y="168" class="sub mono">before ▸ after</text>
      </g>
      <g transform="translate(647 32)">
        <rect width="188" height="186" rx="16" fill="url(#tile)" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="18" y="56" class="num" fill="url(#g3)">99.8%</text>
        <text x="18" y="84" class="lbl">uptime</text>
        <text x="18" y="102" class="sub mono">AWS infrastructure</text>
        <rect x="18" y="140" width="152" height="8" rx="4" fill="#ffffff" fill-opacity=".07"/>
        <rect x="18" y="140" width="151.7" height="8" rx="4" fill="url(#g3)" class="grow"/>
        <text x="18" y="168" class="sub mono">insurer-facing services</text>
      </g>
      <g transform="translate(849 32)">
        <rect width="188" height="186" rx="16" fill="url(#tile)" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="18" y="56" class="num" fill="url(#g1)">10K+</text>
        <text x="18" y="84" class="lbl">concurrent requests</text>
        <text x="18" y="102" class="sub mono">WebSockets · 99.5% uptime</text>
        <g fill="url(#g1)">
          <rect x="18" y="148" width="10" height="8" rx="2" class="rise" style="animation-delay:0.38s"/><rect x="32" y="142" width="10" height="14" rx="2" class="rise" style="animation-delay:0.46s"/>
          <rect x="46" y="136" width="10" height="20" rx="2" class="rise" style="animation-delay:0.54s"/><rect x="60" y="130" width="10" height="26" rx="2" class="rise" style="animation-delay:0.62s"/>
          <rect x="74" y="124" width="10" height="32" rx="2" class="rise" style="animation-delay:0.70s"/><rect x="88" y="128" width="10" height="28" rx="2" class="rise" style="animation-delay:0.78s"/>
          <rect x="102" y="120" width="10" height="36" rx="2" class="rise" style="animation-delay:0.86s"/><rect x="116" y="126" width="10" height="30" rx="2" class="rise" style="animation-delay:0.94s"/>
          <rect x="130" y="118" width="10" height="38" rx="2" class="rise" style="animation-delay:1.02s"/><rect x="144" y="122" width="10" height="34" rx="2" class="rise" style="animation-delay:1.10s"/>
          <rect x="158" y="116" width="10" height="40" rx="2" class="rise" style="animation-delay:1.18s"/>
        </g>
        <text x="18" y="176" class="sub mono">real-time localization</text>
      </g>
      <g transform="translate(1051 32)">
        <rect width="188" height="186" rx="16" fill="url(#tile)" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="18" y="56" class="num" fill="url(#g2)">95+</text>
        <text x="18" y="84" class="lbl">Lighthouse performance</text>
        <text x="18" y="102" class="sub mono">TTI 4.2s → 2.5s</text>
        <g transform="translate(94 146)">
          <circle r="24" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="6"/>
          <circle r="24" fill="none" stroke="url(#g2)" stroke-width="6" stroke-linecap="round" stroke-dasharray="143 151" transform="rotate(-90)">
            <animate attributeName="stroke-dasharray" from="0 151" to="143 151" dur="2.2s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
          </circle>
          <text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">95</text>
        </g>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="249" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
</svg>
