<svg xmlns="http://www.w3.org/2000/svg" width="620" height="270" viewBox="0 0 620 270" role="img" aria-labelledby="title desc">
  <title id="title">Fieldnotes Studio</title>
  <desc id="desc">Turns a topic, link, or video into a ready-to-post Instagram carousel, Reel, and caption, with every claim cited. Research, copy, and a second-model audit before display. HTML → Playwright renders, FFmpeg Reels. Runs on free tiers via Telegram, Actions, or CLI. Built with Python, Gemini, Playwright, FFmpeg, Workers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d1d"/><stop offset="1" stop-color="#121531"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f472b6" stop-opacity=".22"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="620" height="270" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, &quot;Segoe UI&quot;, Inter, Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace; }
    .shine { animation: shine 6s ease-in-out infinite; }
    @keyframes shine { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="620" height="270" fill="url(#bg)"/>
    <rect width="620" height="270" fill="url(#glow)" class="shine"/>
    <rect x="20" width="580" height="3" rx="1.5" fill="url(#accent)"/>
    <g class="sans">
      <text x="26" y="46" class="mono" font-size="11" font-weight="700" letter-spacing="1.8" fill="#a78bfa">AI PIPELINE · CONTENT</text>
      <g transform="translate(522 30)"><rect width="72" height="22" rx="11" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/><text x="36" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#c7cbe6">PRIVATE</text></g>
      <text x="26" y="82" font-size="26" font-weight="800" letter-spacing="-.5" fill="#ffffff">Fieldnotes Studio</text>
      <text x="26" y="110" font-size="14" fill="#b4b9dd">Turns a topic, link, or video into a ready-to-post Instagram carousel,</text>
      <text x="26" y="130" font-size="14" fill="#b4b9dd">Reel, and caption, with every claim cited.</text>
      <circle cx="31" cy="161" r="3" fill="url(#accent)"/><text x="44" y="166" font-size="13" fill="#e2e4f7">Research, copy, and a second-model audit before display</text>
      <circle cx="31" cy="182" r="3" fill="url(#accent)"/><text x="44" y="187" font-size="13" fill="#e2e4f7">HTML → Playwright renders, FFmpeg Reels</text>
      <circle cx="31" cy="203" r="3" fill="url(#accent)"/><text x="44" y="208" font-size="13" fill="#e2e4f7">Runs on free tiers via Telegram, Actions, or CLI</text>
      <g class="mono" font-size="11" fill="#e2e4f7"><rect x="26" y="226" width="65.2" height="22" rx="11" fill="url(#accent)" fill-opacity=".14"/><text x="58.6" y="241" text-anchor="middle">Python</text><rect x="99.2" y="226" width="65.2" height="22" rx="11" fill="url(#accent)" fill-opacity=".14"/><text x="131.8" y="241" text-anchor="middle">Gemini</text><rect x="172.4" y="226" width="94" height="22" rx="11" fill="url(#accent)" fill-opacity=".14"/><text x="219.4" y="241" text-anchor="middle">Playwright</text><rect x="274.4" y="226" width="65.2" height="22" rx="11" fill="url(#accent)" fill-opacity=".14"/><text x="307" y="241" text-anchor="middle">FFmpeg</text><rect x="347.59999999999997" y="226" width="72.4" height="22" rx="11" fill="url(#accent)" fill-opacity=".14"/><text x="383.79999999999995" y="241" text-anchor="middle">Workers</text></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="619" height="269" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
</svg>
