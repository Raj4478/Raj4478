<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
  <title id="title">Stack</title>
  <desc id="desc">LANGUAGES: TypeScript, JavaScript, Python, SQL. BACKEND: NestJS, Node.js, Express, FastAPI, Django, REST, WebSockets, JWT. CLOUD &amp; DEVOPS: AWS SQS, S3, Lambda, EC2, Docker, GitHub Actions, Vercel. DATA: PostgreSQL, MongoDB, TypeORM, Migrations, Query tuning. FRONTEND: React, Next.js, Redux Toolkit, Tailwind CSS, i18n. AI &amp; TESTING: Gemini API, Structured output, Playwright, Jest, Vitest, node:test</desc>
