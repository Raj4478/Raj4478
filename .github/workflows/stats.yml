name: Refresh profile stats

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/stats.mjs ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stats.svg; then echo 'No change.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg
          git commit -m 'chore: refresh profile stats'
          git push
