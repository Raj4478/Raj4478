<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Experience timeline</title>
  <desc id="desc">BSc from GNDU in May 2022 and MCA from CGC Jhanjeri in May 2025. Full-Stack Engineer at Vosyn, remote, June to November 2025: i18n with lazy-loaded locales, 60 percent faster translation deploys, an HTML5 audio player with WebVTT subtitles, a 95-plus Lighthouse score, and 10 thousand concurrent WebSocket requests at 99.5 percent uptime. Software Development Engineer I at Bimaplan, a YC-backed insurtech in Chandigarh, from November 2025 to the present: proxy modules for four insurers with AES-256-CBC and JWT, an event-driven OCR claims pipeline that is 65 percent faster, SQS FIFO with a dead-letter queue cutting unhandled errors by 90 percent, and indexing that cut database response time by 55 percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070812"/><stop offset="1" stop-color="#0c0e22"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151833"/><stop offset="1" stop-color="#0f1126"/></linearGradient>
    <linearGradient id="now" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <linearGradient id="past" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset=".45" stop-color="#a78bfa"/><stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="haze"><stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="1280" height="420" rx="22"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .co { font-size: 24px; font-weight: 800; fill: #ffffff; letter-spacing: -.4px; }
    .role { font-size: 14px; font-weight: 600; }
    .meta { font-size: 12px; fill: #8b93c9; }
    .pt { font-size: 13.5px; fill: #c7cbe6; }
    .hi { fill: #ffffff; font-weight: 700; }
    .pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { opacity: .9; transform: scale(.7); } 100% { opacity: 0; transform: scale(2.8); } }
    .draw { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 2.4s ease-out .2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .draw { stroke-dashoffset: 0; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <ellipse cx="980" cy="160" rx="460" ry="220" fill="url(#haze)"/>

    <g class="sans">
      <!-- Vosyn -->
      <g transform="translate(40 34)">
        <rect width="580" height="270" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/>
        <rect x="18" width="544" height="3" rx="1.5" fill="url(#past)"/>
        <text x="26" y="50" class="co">Vosyn</text>
        <text x="26" y="74" class="role" fill="#c4b5fd">Full-Stack Engineer</text>
        <text x="554" y="50" text-anchor="end" class="meta mono">JUN – NOV 2025</text>
        <text x="554" y="74" text-anchor="end" class="meta">Remote · LinkedIn Top Startups Canada #4</text>
        <g class="pt">
          <circle cx="32" cy="111" r="3" fill="#a78bfa"/><text x="46" y="116">i18n with per-locale lazy loading via CDN · <tspan class="hi">60% faster</tspan> deploys</text>
          <circle cx="32" cy="145" r="3" fill="#a78bfa"/><text x="46" y="150">HTML5 audio player with WebVTT subtitles · <tspan class="hi">−180 KB</tspan> bundle</text>
          <circle cx="32" cy="179" r="3" fill="#a78bfa"/><text x="46" y="184"><tspan class="hi">95+ Lighthouse</tspan> and 98% mobile usability via code-splitting</text>
          <circle cx="32" cy="213" r="3" fill="#a78bfa"/><text x="46" y="218"><tspan class="hi">10K+ concurrent</tspan> WebSocket requests at 99.5% uptime</text>
        </g>
        <g class="mono" font-size="11">
          <rect x="26" y="236" width="62" height="20" rx="10" fill="#a78bfa" fill-opacity=".12"/><text x="57" y="250" text-anchor="middle" fill="#c4b5fd">React</text>
          <rect x="94" y="236" width="72" height="20" rx="10" fill="#a78bfa" fill-opacity=".12"/><text x="130" y="250" text-anchor="middle" fill="#c4b5fd">Next.js</text>
          <rect x="172" y="236" width="92" height="20" rx="10" fill="#a78bfa" fill-opacity=".12"/><text x="218" y="250" text-anchor="middle" fill="#c4b5fd">WebSockets</text>
          <rect x="270" y="236" width="108" height="20" rx="10" fill="#a78bfa" fill-opacity=".12"/><text x="324" y="250" text-anchor="middle" fill="#c4b5fd">GitHub Actions</text>
        </g>
      </g>

      <!-- Bimaplan -->
      <g transform="translate(660 34)">
        <rect width="580" height="270" rx="18" fill="url(#card)" stroke="#60a5fa" stroke-opacity=".35"/>
        <rect x="18" width="544" height="3" rx="1.5" fill="url(#now)"/>
        <text x="26" y="50" class="co">Bimaplan</text>
        <text x="26" y="74" class="role" fill="#93c5fd">Software Development Engineer I</text>
        <g transform="translate(486 34)">
          <rect width="68" height="22" rx="11" fill="#5eead4" fill-opacity=".14" stroke="#5eead4" stroke-opacity=".5"/>
          <circle cx="14" cy="11" r="3.5" fill="#5eead4"/>
          <circle class="pulse" cx="14" cy="11" r="3.5" fill="none" stroke="#5eead4" stroke-width="1.5"/>
          <text x="40" y="15.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#99f6e4">NOW</text>
        </g>
        <text x="554" y="74" text-anchor="end" class="meta">YC-backed insurtech · Chandigarh · since Nov 2025</text>
        <g class="pt">
          <circle cx="32" cy="111" r="3" fill="#60a5fa"/><text x="46" y="116">Proxy modules for <tspan class="hi">4 insurers</tspan> with AES-256-CBC and JWT</text>
          <circle cx="32" cy="145" r="3" fill="#60a5fa"/><text x="46" y="150">Event-driven OCR claims pipeline · <tspan class="hi">65% faster</tspan> processing</text>
          <circle cx="32" cy="179" r="3" fill="#60a5fa"/><text x="46" y="184">SQS FIFO + Dead Letter Queue · <tspan class="hi">90% fewer</tspan> unhandled errors</text>
          <circle cx="32" cy="213" r="3" fill="#60a5fa"/><text x="46" y="218"><tspan class="hi">33,624-row</tspan> bulk upload · indexing cut DB time <tspan class="hi">55%</tspan></text>
        </g>
        <g class="mono" font-size="11">
          <rect x="26" y="236" width="70" height="20" rx="10" fill="#60a5fa" fill-opacity=".12"/><text x="61" y="250" text-anchor="middle" fill="#93c5fd">NestJS</text>
          <rect x="102" y="236" width="74" height="20" rx="10" fill="#60a5fa" fill-opacity=".12"/><text x="139" y="250" text-anchor="middle" fill="#93c5fd">TypeORM</text>
          <rect x="182" y="236" width="94" height="20" rx="10" fill="#60a5fa" fill-opacity=".12"/><text x="229" y="250" text-anchor="middle" fill="#93c5fd">PostgreSQL</text>
          <rect x="282" y="236" width="128" height="20" rx="10" fill="#60a5fa" fill-opacity=".12"/><text x="346" y="250" text-anchor="middle" fill="#93c5fd">AWS SQS · S3 · EC2</text>
        </g>
      </g>
    </g>

    <!-- rail -->
    <path d="M60 362 H1220" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
    <path d="M60 362 H1220" stroke="url(#rail)" stroke-width="2.5" class="draw"/>
    <g class="sans" font-size="12">
      <g transform="translate(120 362)"><circle r="6" fill="#0c0e22" stroke="#6b7299" stroke-width="2"/><text y="32" text-anchor="middle" fill="#8b93c9">BSc · GNDU</text><text y="-14" text-anchor="middle" class="mono" font-size="10.5" fill="#6b7299">MAY 2022</text></g>
      <g transform="translate(330 362)"><circle r="6" fill="#0c0e22" stroke="#8b93c9" stroke-width="2"/><text y="32" text-anchor="middle" fill="#a5abd6">MCA · CGC Jhanjeri</text><text y="-14" text-anchor="middle" class="mono" font-size="10.5" fill="#6b7299">MAY 2025</text></g>
      <g transform="translate(560 362)"><circle r="7" fill="#0c0e22" stroke="#a78bfa" stroke-width="2.5"/><text y="32" text-anchor="middle" fill="#c4b5fd">Vosyn</text><text y="-14" text-anchor="middle" class="mono" font-size="10.5" fill="#8b93c9">JUN 2025</text></g>
      <g transform="translate(860 362)"><circle r="7" fill="#0c0e22" stroke="#60a5fa" stroke-width="2.5"/><text y="32" text-anchor="middle" fill="#93c5fd">Bimaplan</text><text y="-14" text-anchor="middle" class="mono" font-size="10.5" fill="#8b93c9">NOV 2025</text></g>
      <g transform="translate(1180 362)" filter="url(#glow)"><circle r="7" fill="#5eead4"/><text y="32" text-anchor="middle" fill="#99f6e4" font-weight="700">Today</text></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="419" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
</svg>
