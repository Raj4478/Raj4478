<svg xmlns="http://www.w3.org/2000/svg" width="620" height="270" viewBox="0 0 620 270" role="img" aria-labelledby="title desc">
  <title id="title">Socially</title>
  <desc id="desc">A social platform built for speed: fast first load, better Core Web Vitals, real beta users. 1.8 s initial page load. +35% Core Web Vitals. 200+ beta users. Built with Next.js, TypeScript, Tailwind.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d1d"/><stop offset="1" stop-color="#121531"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#5eead4" stop-opacity=".22"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="620" height="270" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, &quot;Segoe UI&quot;, Inter, Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace; }
    .shine { animation: shine 6s ease-in-out infinite; }
    @keyframes shine { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="620" height="270" fill="url(#bg)"/>
    <rect width="620" height="270" fill="url(#glow)" class="shine"/>
    <rect x="20" width="580" height="3" rx="1.5" fill="url(#accent)"/>
    <g class="sans">
      <text x="26" y="46" class="mono" font-size="11" font-weight="700" letter-spacing="1.8" fill="#60a5fa">SOCIAL PLATFORM</text>
      <g transform="translate(522 30)"><rect width="72" height="22" rx="11" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/><text x="36" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#c7cbe6">PUBLIC</text></g>
      <text x="26" y="82" font-size="26" font-weight="800" letter-spacing="-.5" fill="#ffffff">Socially</text>
      <text x="26" y="110" font-size="14" fill="#b4b9dd">A social platform built for speed: fast first load, better Core Web</text>
      <text x="26" y="130" font-size="14" fill="#b4b9dd">Vitals, real beta users.</text>
      <circle cx="31" cy="161" r="3" fill="url(#accent)"/><text x="44" y="166" font-size="13" fill="#e2e4f7">1.8 s initial page load</text>
      <circle cx="31" cy="182" r="3" fill="url(#accent)"/><text x="44" y="187" font-size="13" fill="#e2e4f7">+35% Core Web Vitals</text>
      <circle cx="31" cy="203" r="3" fill="url(#accent)"/><text x="44" y="208" font-size="13" fill="#e2e4f7">200+ beta users</text>
      <g class="mono" font-size="11" fill="#e2e4f7"><rect x="26" y="226" width="72.4" height="22" rx="11" fill="url(#accent)" fill-opacity=".14"/><text x="62.2" y="241" text-anchor="middle">Next.js</text><rect x="106.4" y="226" width="94" height="22" rx="11" fill="url(#accent)" fill-opacity=".14"/><text x="153.4" y="241" text-anchor="middle">TypeScript</text><rect x="208.4" y="226" width="79.6" height="22" rx="11" fill="url(#accent)" fill-opacity=".14"/><text x="248.2" y="241" text-anchor="middle">Tailwind</text></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="619" height="269" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
</svg>
