<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="24" viewBox="0 0 1280 24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset=".25" stop-color="#818cf8"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset=".75" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>.dot { animation: travel 6s linear infinite; } @keyframes travel { from { transform: translateX(0); } to { transform: translateX(1100px); } } @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }</style>
  <rect x="0" y="11" width="1280" height="2" rx="1" fill="url(#g)"/>
  <circle class="dot" cx="90" cy="12" r="4" fill="#e0e7ff"/>
</svg>
